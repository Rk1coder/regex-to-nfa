kind = "web"
previewPath = "/"
title = "Thompson NFA Studio"
version = "1.0.0"
id = "artifacts/thompson-nfa-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20748

[services.development]
run = "pnpm --filter @workspace/thompson-nfa-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thompson-nfa-studio", "run", "build" ]
publicDir = "artifacts/thompson-nfa-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20748"
BASE_PATH = "/"
